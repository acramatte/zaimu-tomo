name: Release Please

# On every push to main, release-please reads the conventional commits since
# the last release and keeps one release PR open that bumps `mix.exs`, the
# manifest and CHANGELOG.md. Merging that PR tags `vX.Y.Z` and publishes the
# GitHub Release with the same notes. Configuration lives in
# release-please-config.json; see docs/deployment.md "Releases".
on:
  push:
    branches: [release-please-sandbox]

# One run at a time, so two quick pushes can't race on the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR and GitHub Release
    runs-on: ubuntu-26.04

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: release-please-sandbox
